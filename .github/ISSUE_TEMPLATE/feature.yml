name: Feature request
description: Propose a focused improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Never include a real subscription URL, password, provider, or VPN
        configuration in an issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change and its trade-offs.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility
      description: Explain credential, provider, and runtime implications.
