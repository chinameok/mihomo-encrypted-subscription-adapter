name: Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then version="${{ inputs.tag }}"; fi
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          mkdir -p dist/stage
          binary="mihomo-subscription-adapter-$GOOS-$GOARCH$suffix"
          go build -trimpath -buildvcs=false             -ldflags "-s -w"             -o "dist/stage/$binary" ./cmd/mihomo-subscription-adapter
          tar -C dist/stage -czf "dist/$binary-$version.tar.gz" "$binary"
          (cd dist && sha256sum "$binary-$version.tar.gz" > "$binary-$version.tar.gz.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then tag="${{ inputs.tag }}"; fi
          gh release create "$tag" dist/*             --repo "$GITHUB_REPOSITORY"             --title "$tag"             --generate-notes
